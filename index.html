<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    
    <!-- Primary Meta Tags -->
    <title>Matbex | Restaurant OS for COGS, Payroll & Inventory</title>
    <meta name="title" content="Matbex | Restaurant OS for COGS, Payroll & Inventory" />
    <meta name="description" content="Restaurant operating system with real-time COGS tracking, automated payroll, inventory sync, and daily profit monitoring. Start free." />
    <meta name="keywords" content="restaurant management software, restaurant POS, COGS tracking, restaurant payroll, inventory management, restaurant operating system, food cost control, kitchen management, restaurant analytics" />
    <meta name="author" content="Matbex" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />
    <meta name="google-site-verification" content="Roz5o20HzcFtLbsFfWx_2OhnNMEvztMWF3hU6YAMlx4" />
    <!-- Canonical is set per-route via RouteSeo (react-helmet-async) to avoid duplicate <link rel="canonical"> tags. -->
    <!-- Performance Hints -->
    <link rel="preconnect" href="%VITE_API_URL%" crossorigin />
    <!-- Self-hosted webfonts: same-origin, so no DNS/TLS round-trips to a
         third-party font host before first paint. The two faces used by the
         first screen are preloaded; the rest load with the stylesheet. -->
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Inter-300-700-latin-f11d72.woff2" crossorigin />
    <link rel="stylesheet" href="/fonts/fonts.css" />

    <!-- Favicon -->
    <!-- /favicon.ico is what Google specifically fetches for the search-result icon. -->
    <link rel="icon" href="/favicon.ico?v=20260814" sizes="any" />
    <link rel="shortcut icon" href="/favicon.ico?v=20260814" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=20260814" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=20260814" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon.png?v=20260814" />

    <link rel="icon" type="image/png" sizes="192x192" href="/matbex-icon-192.png?v=20260814" />
    <link rel="icon" type="image/png" sizes="512x512" href="/matbex-icon-512.png?v=20260814" />

    <!-- Web App Manifest (install icons) -->
    <link rel="manifest" href="/manifest.webmanifest?v=20260814" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://matbex.com/" />
    <meta property="og:title" content="Matbex | Restaurant Operating System" />
    <meta property="og:description" content="Real-time COGS tracking, automated payroll, inventory sync, and daily profit monitoring." />
    <meta property="og:image" content="https://matbex.com/og-image.png" />
    <meta property="og:image:width" content="1200" />

    <meta property="og:site_name" content="Matbex" />

    <meta property="og:locale:alternate" content="ar_SA" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://matbex.com/" />
    <meta name="twitter:title" content="Matbex - Restaurant Operating System" />
    <meta name="twitter:description" content="The unified operating system for precision-driven restaurant management. Real-time COGS tracking, automated payroll, and daily profit monitoring." />
    <meta name="twitter:image" content="https://matbex.com/og-image.png" />
    <meta name="twitter:image:alt" content="Matbex Restaurant Management Dashboard" />
    
    <!-- Additional SEO -->
    <meta name="theme-color" content="#00A859" />
    <meta name="application-name" content="Matbex" />
    <meta name="apple-mobile-web-app-title" content="Matbex" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="mobile-web-app-capable" content="yes" />
    
    <!-- Structured Data - Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "Matbex",
      "url": "https://matbex.com",
      "logo": "https://matbex.com/favicon.png",
      "description": "The unified operating system for precision-driven restaurant management",
      "sameAs": [],
      "contactPoint": {
        "@type": "ContactPoint",
        "contactType": "customer service",
        "availableLanguage": ["English", "Arabic"]
      }
    }
    </script>
    
    <!-- Structured Data - SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "Matbex",
      "applicationCategory": "BusinessApplication",
      "operatingSystem": "Web",
      "offers": {
        "@type": "AggregateOffer",
        "lowPrice": "0",
        "highPrice": "499",
        "priceCurrency": "USD",
        "offerCount": "4"
      },
      "description": "Restaurant operating system with real-time COGS tracking, automated payroll, inventory management, and daily profit monitoring.",

        "Real-time COGS Tracking",
        "Automated Payroll",

        "Multi-location Support",

        },

    <!-- Structured Data - WebSite with SearchAction -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Matbex",
      "url": "https://matbex.com",
      "description": "Restaurant Operating System",
      "inLanguage": ["en", "ar"]
    }

    <!-- FAQPage JSON-LD intentionally not declared globally; it is injected
         per-route (e.g. LandingPageSEO) to avoid duplicate FAQPage schemas. -->
  </head>
  <body>
    <div id="root">
      <!-- Pre-hydration LCP shell: paints the hero headline from raw HTML so
           Lighthouse / real users see the LCP element before the JS bundle
           parses. React replaces #root contents on mount. Inline styles so
           no extra CSS download is required. -->
      <div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:96px 24px;background:#fafaf9;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;">
        <div style="max-width:1280px;width:100%;">
          <div style="display:inline-flex;align-items:center;gap:8px;padding:4px 10px;border-radius:9999px;background:#fff;border:1px solid #e5e7eb;margin-bottom:28px;">
            <span style="width:6px;height:6px;border-radius:9999px;background:#00A859;display:inline-block;"></span>
            <span style="font-size:12px;font-weight:500;color:#374151;letter-spacing:-0.005em;">Operating system for restaurants</span>
          </div>
          <h1 style="font-size:clamp(40px,7vw,64px);font-weight:600;letter-spacing:-0.01em;color:#111827;line-height:1.04;margin:0 0 24px;max-width:720px;">
            Your Entire Restaurant,<br />
            <span style="color:#6b7280;">Synchronized.</span>
          </h1>
          <p style="font-size:18px;color:#4b5563;line-height:1.55;max-width:560px;margin:0;">
            Real-time COGS, automated payroll, inventory sync, and live profit — one operational system for the entire kitchen.
          </p>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
