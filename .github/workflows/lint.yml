name: Lint

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: ESLint
        run: bun run lint

      - name: Module boundaries (warn-only baseline)
        run: bun run lint:boundaries || true

      - name: Heading hierarchy
        run: bun run lint:headings

      - name: Edge-function auth allowlist
        run: bun run lint:edge-auth

      - name: Supabase types drift
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_ID: tlkyubkbbqwmzjaogavb
        # Self-skips when SUPABASE_ACCESS_TOKEN is unset (e.g. fork PRs).
        run: bun run lint:types-drift

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build (production)
        run: bun run build
      - name: Enforce bundle budget (size-limit)
        run: bun run lint:bundle

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bunx vitest run