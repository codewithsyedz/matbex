name: CI

on:
  pull_request:
  push:
    branches: [main, custom-backend]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: ESLint
        run: npm run lint
      - name: Module boundaries (warn-only baseline)
        run: npm run lint:boundaries || true
      - name: Heading hierarchy
        run: npm run lint:headings
      - name: Public server-function auth allowlist
        run: npm run lint:edge-auth
      - name: Typecheck web
        run: npx tsc -p tsconfig.app.json --noEmit

  bundle-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Build (production)
        run: npm run build
        env:
          VITE_API_URL: https://api.example.test
          VITE_API_KEY: ci
      - name: Enforce bundle budget (size-limit)
        run: npm run lint:bundle

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npx vitest run

  # Applies every migration to a clean Postgres, checks generated types, and runs
  # the end-to-end smoke test (auth, data/RLS, rpc, storage, functions, realtime, MFA, MCP).
  backend:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/matbex
      AUTHENTICATOR_PASSWORD: ci-authenticator
      JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0123
      API_URL: http://localhost:8000
      SITE_URL: http://localhost:8080
      POSTGREST_URL: http://localhost:3000
      AUTH_AUTOCONFIRM: "true"
      STORAGE_DRIVER: fs
      STORAGE_FS_ROOT: /tmp/matbex-storage
      JOBS_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: matbex }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci --no-audit --no-fund
      - run: npm --prefix server ci --no-audit --no-fund
      - name: Typecheck API
        run: npm --prefix server run typecheck
      - name: Typecheck server functions
        run: npm --prefix server run typecheck:functions
      - name: Function unit tests
        run: npm --prefix server test
      - name: Apply migrations to a clean database
        run: node db/migrate.mjs
      - name: Tenant isolation audit (RLS on every tenant table, no unapproved open policies)
        run: node db/check-rls.mjs
      - name: Generated DB types are up to date
        run: node scripts/generate-db-types.mjs --check
      - name: Keys for CI
        run: npm --prefix server run keys | grep -E '^(ANON_KEY|SERVICE_ROLE_KEY)=' >> "$GITHUB_ENV"
        env: { JWT_SECRET: ci-jwt-secret-ci-jwt-secret-ci-jwt-secret-0123 }
      - name: Start PostgREST
        run: |
          docker run -d --name postgrest --network host \
            -e PGRST_DB_URI=postgres://authenticator:ci-authenticator@localhost:5432/matbex \
            -e PGRST_DB_SCHEMAS=public -e PGRST_DB_ANON_ROLE=anon \
            -e PGRST_DB_EXTRA_SEARCH_PATH="public, extensions" \
            -e PGRST_JWT_SECRET=$JWT_SECRET postgrest/postgrest:v12.2.3
      - name: Build + start API
        run: |
          npm --prefix server run build
          (node server/dist/index.mjs > api.log 2>&1 &)
          for i in $(seq 1 30); do curl -sf localhost:8000/health && break; sleep 1; done
      - name: Smoke test
        run: cd server && npx tsx scripts/smoke-test.ts
      - if: failure()
        run: cat api.log

  # Deploys https://staging.matbex.com after every check above passes on a push to
  # custom-backend (docs/self-hosting/STAGING.md). The commit is copied with `git archive`
  # (no repository access on the server); deploy/staging-deploy.sh then builds, migrates,
  # restarts and runs the smoke test there. Skipped until the secrets exist.
  # Repository secrets (Settings → Secrets and variables → Actions):
  #   STAGING_HOST, STAGING_SSH_KEY (CI deploy key), STAGING_KNOWN_HOSTS (ssh-keyscan of the host)
  deploy-staging:
    needs: [lint, bundle-budget, tests, backend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/custom-backend'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency: { group: deploy-staging, cancel-in-progress: false }
    env:
      HAS_KEY: ${{ secrets.STAGING_SSH_KEY != '' }}
    steps:
      - if: env.HAS_KEY != 'true'
        run: echo "::notice::STAGING_SSH_KEY is not set; skipping the staging deploy."
      - if: env.HAS_KEY == 'true'
        uses: actions/checkout@v4
      - name: SSH setup
        if: env.HAS_KEY == 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.STAGING_KNOWN_HOSTS }}
          HOST: ${{ secrets.STAGING_HOST }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/staging && chmod 600 ~/.ssh/staging
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          printf 'Host staging\n  HostName %s\n  User deploy\n  IdentityFile ~/.ssh/staging\n  IdentitiesOnly yes\n  StrictHostKeyChecking yes\n' "$HOST" > ~/.ssh/config
      - name: Copy the commit to the server
        if: env.HAS_KEY == 'true'
        run: git archive --format=tar HEAD | ssh staging "tar -x -C ~/matbex && echo $(git rev-parse --short HEAD) > ~/matbex/.deployed-commit"
      - name: Build, migrate, restart, smoke test
        if: env.HAS_KEY == 'true'
        run: ssh staging 'bash ~/matbex/deploy/staging-deploy.sh'
