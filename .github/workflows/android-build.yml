name: Android Build

on:
  push:
    branches: [main]
  pull_request:
    paths: ["android/**", "android-overlay/**", "capacitor.config.ts", "scripts/apply-android-signing.sh", ".github/workflows/android-build.yml"]
  workflow_dispatch:

jobs:
  build:
    name: Build signed APK & AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default list still includes the removed 'tools' package and fails.
          packages: platform-tools platforms;android-36

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build
        env:
          # Repository variables (Settings → Secrets and variables → Actions → Variables)
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_API_KEY: ${{ vars.VITE_API_KEY }}

      - name: Add Android platform
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Capacitor sync
        run: npx cap sync android

      - name: Apply signing config
        run: bash scripts/apply-android-signing.sh

      - name: Decode signing keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/release.keystore
          echo "ANDROID_KEYSTORE_FILE=$(pwd)/android/app/release.keystore" >> $GITHUB_ENV

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          if [ -n "$ANDROID_KEYSTORE_FILE" ]; then
            ./gradlew assembleRelease
          else
            echo "No signing keystore configured — building unsigned debug APK."
            ./gradlew assembleDebug
          fi

      - name: Build release AAB
        if: ${{ env.ANDROID_KEYSTORE_FILE != '' }}
        working-directory: android
        env:
          ANDROID_KEYSTORE_FILE: ${{ env.ANDROID_KEYSTORE_FILE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew bundleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: matbex-android-apk-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 30

      - name: Upload AAB artifact
        if: ${{ env.ANDROID_KEYSTORE_FILE != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: matbex-android-aab-${{ github.sha }}
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 30