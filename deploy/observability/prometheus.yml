# Prometheus scrape config (docker-compose.observability.yml). All targets are on the
# internal Docker network; nothing here is published through Caddy.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: matbex-api
    static_configs:
      - targets: ["api:9464"]

  - job_name: matbex-worker
    static_configs:
      - targets: ["worker:9464"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: redis
    static_configs:
      - targets: ["redis-exporter:9121"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
